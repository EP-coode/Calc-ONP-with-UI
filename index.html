<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="calc">
        <div class="calc__display calc__display--secondary"></div>
        <div class="calc__display"></div>
        <div class="calc__keyboard">
            <!-- [=,+,-,*,/,.,AC,...9,] -->
            <div class="calc__input" id="val_AC">AC</div>
            <div class="calc__input" id="val_*">*</div>
            <div class="calc__input" id="val_/">/</div>
            <div class="calc__input" id="val_1">1</div>
            <div class="calc__input" id="val_2">2</div>
            <div class="calc__input" id="val_3">3</div>
            <div class="calc__input" id="val_-">-</div>
            <div class="calc__input" id="val_4">4</div>
            <div class="calc__input" id="val_5">5</div>
            <div class="calc__input" id="val_6">6</div>
            <div class="calc__input" id="val_+">+</div>
            <div class="calc__input" id="val_7">7</div>
            <div class="calc__input" id="val_8">8</div>
            <div class="calc__input" id="val_9">9</div>
            <div class="calc__input" id="val_equals">=</div>
            <div class="calc__input" id="val_0">0</div>
            <div class="calc__input" id="val_.">.</div>
        </div>
    </div>
</body>
<script src="calc.js"></script>

</html>
